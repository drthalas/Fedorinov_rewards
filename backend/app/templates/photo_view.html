{% extends "base.html" %}
{% block title %}{{ label }}{% endblock %}
{% block content %}
<section class="photo-viewer">
  <div class="photo-viewer-header">
    <h1>{{ label }}</h1>
    <a class="button" href="{{ return_to }}">Назад</a>
  </div>
  {% if has_media_path(path) %}
    <img class="photo-viewer-image" src="{{ media_url(path) }}" alt="{{ label }}">
  {% else %}
    <div class="notice">Нет фото.</div>
  {% endif %}
</section>
{% endblock %}
