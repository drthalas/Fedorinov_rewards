<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Fedorinov Rewards{% endblock %}</title>
    <link rel="stylesheet" href="{{ static_url('styles.css') }}">
  </head>
  <body class="legacy-body">
    <header class="legacy-app-header">
      <div class="legacy-titlebar">
        <span>Fedorinov Rewards</span>
        {% if settings is defined and settings.write_mode %}
        <span class="legacy-mode legacy-mode-write">Рабочий режим</span>
        {% else %}
        <span class="legacy-mode legacy-mode-readonly">Режим просмотра</span>
        {% endif %}
      </div>
      <nav class="legacy-tabs" aria-label="Разделы">
        {% for tab_id, label in tabs %}
          <a class="{% if tab == tab_id %}active{% endif %}" href="/legacy?tab={{ tab_id }}">{{ label }}</a>
        {% endfor %}
      </nav>
    </header>
    <main class="legacy-shell">
      {% block content %}{% endblock %}
    </main>
    {% include "_lightbox.html" %}
    <script src="{{ static_url('cascading_guides.js') }}" defer></script>
    <script src="{{ static_url('search_suggestions.js') }}" defer></script>
    <script src="{{ static_url('search_results.js') }}" defer></script>
    <script src="{{ static_url('save_as.js') }}" defer></script>
    <script src="{{ static_url('clipboard_paste.js') }}" defer></script>
    <script src="{{ static_url('confirm_submit.js') }}" defer></script>
    <script src="{{ static_url('escape_back.js') }}" defer></script>
    <script src="{{ static_url('legacy_rewards.js') }}" defer></script>
    <script src="{{ static_url('update_progress.js') }}" defer></script>
  </body>
</html>
