<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Fedorinov Rewards{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
  </head>
  <body>
    <nav class="topbar">
      <a href="/legacy?tab=rewards">Главная</a>
      <a href="/legacy?tab=rewards">Награды</a>
      <a href="/legacy?tab=marks">Знаки</a>
      <a href="/legacy?tab=search">Поиск</a>
      <a href="/guides">Справочник</a>
      <a href="/dashboard">Диагностика</a>
      <a href="/health">Health</a>
    </nav>
    {% if settings is defined and settings.write_mode %}
    <div class="mode-banner mode-write">Рабочий режим · обычное редактирование включено</div>
    {% else %}
    <div class="mode-banner mode-readonly">Режим просмотра · редактирование выключено</div>
    {% endif %}
    <main class="page">
      {% block content %}{% endblock %}
    </main>
    {% include "_lightbox.html" %}
    <script src="{{ url_for('static', path='cascading_guides.js') }}" defer></script>
    <script src="{{ url_for('static', path='search_suggestions.js') }}" defer></script>
    <script src="{{ url_for('static', path='clipboard_paste.js') }}" defer></script>
    <script src="{{ url_for('static', path='escape_back.js') }}" defer></script>
  </body>
</html>
