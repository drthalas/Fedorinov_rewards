<!doctype html>
<html lang="ru" class="document-loading"{% block document_theme_attribute %}{% endblock %}>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Fedorinov Rewards{% endblock %}</title>
    <link rel="stylesheet" href="{{ static_url('styles.css') }}">
    <script src="{{ static_url('document_transition.js') }}" defer></script>
    {% block extra_head %}{% endblock %}
  </head>
  <body class="legacy-body {% block body_class %}{% endblock %}">
    {% include "_document_transition_curtain.html" %}
    {% include "_user_nav.html" %}
    {% include "_transient_notifications.html" %}
    <main class="page">
      {% block content %}{% endblock %}
    </main>
    {% include "_lightbox.html" %}
    <script src="{{ static_url('cascading_guides.js') }}" defer></script>
    <script src="{{ static_url('reward_reference_fields.js') }}" defer></script>
    <script src="{{ static_url('reward_duplicate_check.js') }}" defer></script>
    <script src="{{ static_url('person_form_validation.js') }}" defer></script>
    <script src="{{ static_url('person_edit_draft.js') }}" defer></script>
    <script src="{{ static_url('person_create_draft.js') }}" defer></script>
    <script src="{{ static_url('search_suggestions.js') }}" defer></script>
    <script src="{{ static_url('search_results.js') }}" defer></script>
    <script src="{{ static_url('save_as.js') }}" defer></script>
    <script src="{{ static_url('summary_pdf_options.js') }}" defer></script>
    <script src="{{ static_url('image_replacement_confirmation.js') }}" defer></script>
    <script src="{{ static_url('clipboard_paste.js') }}" defer></script>
    <script src="{{ static_url('confirm_submit.js') }}" defer></script>
    <script src="{{ static_url('transient_notifications.js') }}" defer></script>
    <script src="{{ static_url('guide_tree_state.js') }}" defer></script>
    <script src="{{ static_url('guide_image_preview.js') }}" defer></script>
    <script src="{{ static_url('custom_select.js') }}" defer></script>
    <script src="{{ static_url('form_behavior.js') }}" defer></script>
    <script src="{{ static_url('transition_lifecycle.js') }}" defer></script>
    <script src="{{ static_url('search_session_state.js') }}" defer></script>
    <script src="{{ static_url('write_feedback.js') }}" defer></script>
    <script src="{{ static_url('escape_back.js') }}" defer></script>
  </body>
</html>
