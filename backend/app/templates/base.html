<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Fedorinov Rewards{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
  </head>
  <body>
    <nav class="topbar">
      <a href="/">Dashboard</a>
      <a href="/persons">Награжденные</a>
      <a href="/marks">Знаки</a>
      <a href="/guides">Справочник</a>
      <a href="/search">Поиск</a>
      <a href="/health">Health</a>
    </nav>
    {% if settings is defined and settings.write_mode %}
    <div class="mode-banner mode-write">WRITE MODE · Dev write mode</div>
    {% else %}
    <div class="mode-banner mode-readonly">READ ONLY MODE</div>
    {% endif %}
    <main class="page">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
