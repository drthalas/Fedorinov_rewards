<dialog class="photo-editor" data-photo-editor aria-labelledby="photo-editor-title">
  <header class="photo-editor-heading">
    <h2 id="photo-editor-title">Редактировать фото</h2>
    <span data-photo-editor-label></span>
  </header>
  <div class="photo-editor-canvases">
    <section><span>Обрезка</span><div class="photo-editor-canvas-frame"><canvas data-photo-crop tabindex="0" aria-label="Область обрезки" title="Выделите область мышью или касанием. Стрелки — сдвиг, Shift со стрелками — размер."></canvas></div></section>
    <section><span>Предпросмотр</span><div class="photo-editor-canvas-frame"><canvas data-photo-preview aria-label="Предпросмотр результата"></canvas></div></section>
  </div>
  <label class="photo-editor-brightness">Яркость <output data-photo-brightness-value>100%</output>
    <input type="range" data-photo-brightness aria-label="Яркость" min="25" max="200" value="100" step="1">
  </label>
  <p class="notice notice-error" data-photo-editor-error role="alert" hidden></p>
  <div class="actions">
    <button type="button" data-photo-editor-reset>Сброс</button>
    <button type="button" class="secondary-button" data-photo-editor-cancel>Отмена</button>
    <button type="button" data-photo-editor-save>Сохранить</button>
  </div>
</dialog>
