{% macro pending_reward(index, reward, guides, default_date='') %}
<section class="pending-reward guide-cascade" data-pending-reward>
  <script type="application/json" data-guide-cascade-options>{{ guide_cascade|tojson }}</script>
  <div class="pending-reward-heading">
    <h3 data-pending-reward-title>Награда</h3>
    <button class="secondary-button pending-reward-remove" type="button" data-remove-pending-reward aria-label="Убрать награду">Убрать</button>
  </div>
  <div class="form-grid two-columns">
    <label>
      <span>Государство</span>
      <select name="reward_{{ index }}_id_gos" data-guide-role="country" data-styled-select>
        <option value="">—</option>
        {% for item in guides.gos|default(guide_cascade.countries, true) %}
        <option value="{{ item.id }}" {% if item.id|string == reward.id_gos|string %}selected{% endif %}>{{ item.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>
      <span>Категория</span>
      <select name="reward_{{ index }}_id_catigory" data-guide-role="category" data-styled-select>
        <option value="">—</option>
        {% for item in guides.categories|default([], true) %}
        <option value="{{ item.id }}" {% if item.id|string == reward.id_catigory|string %}selected{% endif %}>{{ item.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>
      <span>Подкатегория</span>
      <select name="reward_{{ index }}_id_sub_catigory" data-guide-role="subcategory" data-styled-select>
        <option value="">—</option>
        {% for item in guides.subcategories|default([], true) %}
        <option value="{{ item.id }}" {% if item.id|string == reward.id_sub_catigory|string %}selected{% endif %}>{{ item.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>
      <span>Наименование <span class="required-marker" aria-hidden="true">*</span></span>
      <select name="reward_{{ index }}_id_name" data-guide-role="name" data-styled-select required>
        <option value="">—</option>
        {% for item in guides.names|default([], true) %}
        <option value="{{ item.id }}" {% if item.id|string == reward.id_name|string %}selected{% endif %}>{{ item.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>
      <span>Номер</span>
      <input name="reward_{{ index }}_number" value="{{ reward.number or '' }}" inputmode="numeric" autocomplete="off" data-reward-number>
    </label>
    <label>
      <span>Дата покупки</span>
      <input name="reward_{{ index }}_date_purchase" value="{{ (reward.date_purchase or default_date)|format_date_input }}" placeholder="ДД.ММ.ГГГГ" autocomplete="off">
    </label>
    <label>
      <span>Цена покупки</span>
      <input name="reward_{{ index }}_price_purchase" value="{{ reward.price_purchase or '' }}" inputmode="numeric" autocomplete="off">
    </label>
    <label>
      <span>Текущая цена</span>
      <input name="reward_{{ index }}_price_now" value="{{ reward.price_now or '' }}" inputmode="numeric" autocomplete="off">
    </label>
  </div>
  <label>
    <span>Ссылка на Монетный двор / справочник</span>
    <input name="reward_{{ index }}_id_link" value="{{ reward.id_link or '' }}" autocomplete="off">
  </label>
  <label class="checkbox-row">
    <input name="reward_{{ index }}_instock" type="checkbox" {% if reward.instock %}checked{% endif %}>
    <span>В наличии</span>
  </label>
</section>
{% endmacro %}
